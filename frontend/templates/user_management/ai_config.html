{% extends 'base.html' %}{% block title %}AI 配置{% endblock %}
{% block content %}<main class="container py-4" style="max-width:750px"><h1>AI 模型配置</h1><p>API 密钥不会回显。配置后请使用测试连接功能核验模型。</p>
<form id="ai-config-form" class="d-grid gap-3">{% csrf_token %}
<label>服务商 <select name="provider" class="form-select"><option value="openai">OpenAI</option><option value="custom">兼容 API</option><option value="anthropic">Anthropic</option><option value="google">Google</option></select></label>
<label>API 地址 <input class="form-control" name="api_url" type="url" value="{{ ai_config.api_url }}" required></label>
<label>模型 <input class="form-control" name="model_id" value="{{ ai_config.model_id }}" required></label>
<label>API Key <input class="form-control" name="api_key" type="password" autocomplete="new-password" placeholder="留空则保持原密钥"></label>
<button class="btn btn-primary" type="submit">保存配置</button></form><p id="ai-config-status" role="status"></p>
<script>
document.getElementById('ai-config-form').addEventListener('submit',async e=>{
e.preventDefault();const form=e.currentTarget,data=Object.fromEntries(new FormData(form).entries());
delete data.csrfmiddlewaretoken;
try{const response=await fetch(location.pathname,{method:'POST',credentials:'same-origin',
headers:{'Content-Type':'application/json','X-CSRFToken':form.querySelector('[name=csrfmiddlewaretoken]').value},body:JSON.stringify(data)});
const json=await response.json();document.getElementById('ai-config-status').textContent=json.message||json.error||'请求结束';
}catch(err){document.getElementById('ai-config-status').textContent='保存失败';}
});
</script></main>{% endblock %}
